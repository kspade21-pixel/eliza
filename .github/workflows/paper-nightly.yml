# Manually dispatched run of the deterministic paper-trading lane, publishing a
# machine-readable status record for external agents.
#
# Develop Full owns automatic post-merge validation, so this workflow cannot be
# scheduled independently. Every lane runs to completion even when an earlier
# one fails because the emitted record must say exactly which lanes are red.
name: Paper Nightly

on:
  workflow_dispatch:

concurrency:
  group: paper-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  paper:
    name: Paper lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      overall: ${{ steps.status.outputs.overall }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build core workspace dependency
        id: build_core
        run: bun run build:core

      - name: Typecheck paper trading
        id: paper_typecheck
        if: always() && steps.build_core.outcome == 'success'
        run: bun run --cwd plugins/plugin-paper-trading typecheck

      - name: Test paper trading
        id: paper_tests
        if: always() && steps.build_core.outcome == 'success'
        run: bun run --cwd plugins/plugin-paper-trading test

      - name: Test paper status contract
        id: status_contract
        if: always() && steps.install.outcome == 'success'
        run: bun test packages/scripts/__tests__/paper-status.test.ts

      - name: Cloud SDK route coverage
        id: sdk_routes
        if: always() && steps.install.outcome == 'success'
        run: bun run --cwd packages/cloud/sdk test

      - name: Emit agent status record
        id: status
        if: always()
        run: |
          set -euo pipefail
          node packages/scripts/paper-status.mjs \
            --out=paper-status.json \
            --repository=${{ github.repository }} \
            --ref=${{ github.ref_name }} \
            --commit=${{ github.sha }} \
            --run-id=${{ github.run_id }} \
            --lane=install=${{ steps.install.outcome == 'success' && 'pass' || 'fail' }} \
            --lane=build-core=${{ steps.build_core.outcome == 'success' && 'pass' || 'fail' }} \
            --lane=paper-typecheck=${{ steps.paper_typecheck.outcome == 'success' && 'pass' || steps.paper_typecheck.outcome == 'skipped' && 'skip' || 'fail' }} \
            --lane=paper-tests=${{ steps.paper_tests.outcome == 'success' && 'pass' || steps.paper_tests.outcome == 'skipped' && 'skip' || 'fail' }} \
            --lane=status-contract=${{ steps.status_contract.outcome == 'success' && 'pass' || steps.status_contract.outcome == 'skipped' && 'skip' || 'fail' }} \
            --lane=sdk-routes=${{ steps.sdk_routes.outcome == 'success' && 'pass' || steps.sdk_routes.outcome == 'skipped' && 'skip' || 'fail' }}
          overall="$(node -e 'process.stdout.write(require("./paper-status.json").overall)')"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          {
            echo "### Paper nightly: $overall"
            echo
            echo '```json'
            cat paper-status.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload status record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paper-status
          path: paper-status.json
          retention-days: 30
          if-no-files-found: error

  publish-status:
    name: Publish status feed
    needs: paper
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Scoped to this job only: the lane job above stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download status record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: paper-status
          path: incoming

      # ops-status is an orphan branch holding only the feed, so polling agents
      # get a stable raw URL and the history of this file never touches develop.
      - name: Publish to ops-status branch
        env:
          GIT_AUTHOR_NAME: paper-nightly
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: paper-nightly
          GIT_COMMITTER_EMAIL: ci@localhost
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin ops-status >/dev/null 2>&1; then
            git fetch origin ops-status
            git switch ops-status
          else
            git switch --orphan ops-status
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name incoming -exec rm -rf {} +
          fi
          mkdir -p .
          cp incoming/paper-status.json paper-status.json
          rm -rf incoming
          git add paper-status.json
          if git diff --cached --quiet; then
            echo "Status unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore(status): paper nightly ${{ needs.paper.outputs.overall }} for ${GITHUB_SHA:0:7}"
          git push origin ops-status
