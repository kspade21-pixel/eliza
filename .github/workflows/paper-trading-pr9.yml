name: Paper Trading PR 9

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "plugins/plugin-paper-trading/**"
      - ".github/workflows/paper-trading-pr9.yml"

concurrency:
  group: paper-trading-pr9-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    if: github.event.pull_request.number == 9
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build core workspace dependency
        run: bun run build:core

      - name: Typecheck paper trading
        run: bun run --cwd plugins/plugin-paper-trading typecheck

      - name: Test paper trading
        run: bun run --cwd plugins/plugin-paper-trading test

      - name: Build paper trading
        run: bun run --cwd plugins/plugin-paper-trading build
