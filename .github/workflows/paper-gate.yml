# Fast merge gate for the paper-trading lane.
#
# Develop Full is ~95 jobs and takes ~90 minutes, and a large share of its lanes
# cannot pass in a fork at all: they need cloud secrets, Apple/Windows signing,
# paid macOS runners, or live provider credentials. Waiting on that to decide
# whether a paper-trading change is safe to merge means never getting an answer.
#
# This gate runs only steps that are deterministic, secret-free, and verified to
# pass on ubuntu-24.04 from a clean checkout. It is deliberately narrow: it
# proves the paper-trading contract and the workspace still builds. It does not
# replace Develop Full as a release signal.
name: Paper Gate

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: paper-gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  gate:
    name: Paper gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --ignore-scripts keeps the gate off native toolchains and submodule
      # fetches. build:core below produces everything the paper lane consumes.
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate CI Bun version pin contract
        run: node packages/scripts/ci-bun-version-contract.mjs

      - name: Build core workspace dependency
        run: bun run build:core

      - name: Typecheck paper trading
        run: bun run --cwd plugins/plugin-paper-trading typecheck

      - name: Test paper trading
        run: bun run --cwd plugins/plugin-paper-trading test

      # The SDK test script ends in scripts/audit-api-routes.mjs, a static
      # comparison of packages/cloud/api against the generated wrappers in
      # src/public-routes.ts. It has no network or secret dependency, so a
      # regression here is always a real drift and always reproducible.
      - name: Cloud SDK route coverage
        run: bun run --cwd packages/cloud/sdk test

      - name: Lint paper trading
        run: bun run --cwd plugins/plugin-paper-trading lint:check
